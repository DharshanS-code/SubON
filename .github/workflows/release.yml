name: Build and publish APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Android project exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle wrapper ./gradlew is missing. Commit the Android project and Gradle wrapper before creating a release tag."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
